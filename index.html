</style></head><body>
<canvas id="game"></canvas>
<header class="status"><button class="gear" id="settings" aria-label="Settings">⚙</button><button class="paint" id="palette" aria-label="Plant collection">🎨</button><div class="resource"><span class="gem">♦</span><span class="value" id="coins">120</span><button class="plus" data-open="store">+</button></div><div class="resource"><span class="oxygenicon">●</span><span class="value" id="oxy">100%</span><button class="plus" id="waterTop">+</button></div><div class="levelbox">Level <span id="level">1</span><div class="xp"><i id="xpbar"></i></div></div></header>
<div class="shelves" aria-label="Plant room"></div><button class="floatplus" id="addplant" aria-label="Add a plant">✚</button>
<nav class="nav"><button class="active" data-tab="garden"><b>🪴</b>Garden</button><button data-tab="decor"><b>🌈</b>Decor</button><button data-tab="collection"><b>🖼️</b>My plants</button><button data-tab="store"><b>🧺</b>Plant store</button><button data-tab="worlds"><b>🌎</b>Worlds</button></nav>
<div class="sheetback" id="back"><section class="sheet"><div class="sheethead"><h2 id="title">Plant store</h2><button class="close" id="close">Close</button></div><p class="desc" id="desc"></p><div class="stats"><div class="stat"><b id="statcoins">120</b><small>LEAF COINS</small></div><div class="stat"><b id="statplants">4</b><small>PLANTS</small></div><div class="stat"><b id="statworlds">1</b><small>WORLDS</small></div><div class="stat"><b id="statlevel">1</b><small>LEVEL</small></div></div><div class="cards" id="cards"></div></section></div><div class="toast" id="toast"></div><div id="rotate">↻<br> Rotate your device to portrait to play</div>
<script>
(()=>{'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d',{alpha:false}),$=id=>document.getElementById(id);
const assetPlants={0:'01_emerald_fern.png',1:'02_pink_leaf.png',2:'03_bubble_tree.png',3:'04_string_of_pearls.png',4:'05_striped_snake_plant.png',5:'06_tropical_fan.png',6:'07_ruby_bonsai.png',7:'08_golden_money_plant.png',8:'09_moon_orchid.png',9:'10_coral_cactus.png',10:'11_jungle_waterfall.png',11:'12_crystal_bloom.png'};
const assetImages={};Object.entries(assetPlants).forEach(([id,file])=>{const im=new Image();im.src=new URL('assets/plants/'+file,document.baseURI).href;assetImages[id]=im});
const worldImages={};[['greenhouse','world_starter_greenhouse.jpg'],['desert','world_desert_shelf.jpg'],['moon','world_moon_garden.jpg'],['tropical','world_tropical_conservatory.jpg'],['flower','world_flower_palace.jpg']].forEach(([id,file])=>{const im=new Image();im.src=new URL('assets/worlds/'+file,document.baseURI).href;worldImages[id]=im});
const levelImages={};for(let n=1;n<=15;n++){const im=new Image();im.src=new URL('assets/levels/level_'+String(n).padStart(2,'0')+'.png',document.baseURI).href;levelImages[n]=im}
const rewardImages={};['oxygen_orb_mint','reward_orb_blue','reward_orb_green','reward_orb_purple'].forEach((file,i)=>{const im=new Image();im.src=new URL('assets/rewards/'+file+'.png',document.baseURI).href;rewardImages[i]=im});

const plants=[
{id:0,name:'Emerald Fern',emoji:'🌿',price:0,level:1,type:'fern',color:'#15922b',pot:'#a53ec1',desc:'Tall, waving fern fronds.'},
{id:1,name:'Pink Leaf Plant',emoji:'🌱',price:0,level:1,type:'round',color:'#a7f0c4',pot:'#e83e8c',desc:'Pale mint leaves on pink.'},
{id:2,name:'Bubble Tree',emoji:'🌳',price:0,level:1,type:'bubble',color:'#00a81d',pot:'#1688ca',desc:'Round leaves in a blue pot.'},
{id:3,name:'String of Pearls',emoji:'🪴',price:0,level:1,type:'trailing',color:'#00b85c',pot:'#f1a900',desc:'Dangling strands of tiny leaves.'},
{id:4,name:'Striped Snake Plant',emoji:'🌵',price:35,level:2,type:'snake',color:'#1caa4d',pot:'#1186c4',desc:'Tall, pointed striped leaves.'},
{id:5,name:'Tropical Fan',emoji:'🌴',price:45,level:3,type:'fan',color:'#00a94b',pot:'#60bd31',desc:'A dramatic spiky fan of leaves.'},
{id:6,name:'Ruby Bonsai',emoji:'🌿',price:55,level:4,type:'bonsai',color:'#168b28',pot:'#df2b2b',desc:'A tiny tree with a red pot.'},
{id:7,name:'Golden Money Plant',emoji:'🌱',price:65,level:5,type:'money',color:'#1caa35',pot:'#dca000',desc:'A branching leafy lucky plant.'},
{id:8,name:'Moon Orchid',emoji:'🌸',price:80,level:6,type:'orchid',color:'#e7a2ff',pot:'#8d53c8',desc:'A rare purple moon flower.'},
{id:9,name:'Coral Cactus',emoji:'🌵',price:95,level:7,type:'cactus',color:'#28a94c',pot:'#e85c43',desc:'A sunny desert cactus.'},
{id:10,name:'Jungle Waterfall',emoji:'🌿',price:110,level:8,type:'trailing',color:'#008e58',pot:'#e6a600',desc:'Long cascading jungle vines.'},
{id:11,name:'Crystal Bloom',emoji:'🌼',price:130,level:9,type:'bloom',color:'#ffce45',pot:'#e94c8b',desc:'A bright flower with petals.'}
];
const worlds=[{id:'greenhouse',name:'Starter Greenhouse',emoji:'🌿',level:1,cost:0,desc:'Your first plant room.'},{id:'desert',name:'Desert Shelf',emoji:'🌵',level:3,cost:100,desc:'Sandstone shelves and cacti.'},{id:'moon',name:'Moon Garden',emoji:'🌙',level:6,cost:180,desc:'A deep blue night greenhouse.'},{id:'tropical',name:'Tropical Conservatory',emoji:'🌴',level:10,cost:250,desc:'A lush jungle room.'},{id:'flower',name:'Flower Palace',emoji:'🌸',level:15,cost:400,desc:'A colourful flower collection.'}];
let coins=+(localStorage.getItem('terrainium-coins')||120),level=+(localStorage.getItem('terrainium-level')||1),oxygen=+(localStorage.getItem('terrainium-oxygen')||100),owned=read('terrainium-owned-plants',[0,1,2,3]),ownedWorlds=read('terrainium-owned-worlds',['greenhouse','moss']),world=localStorage.getItem('terrainium-room')||'greenhouse',tab='garden',selected=0,watered=0,decor=0;
function read(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}
const placed=[{id:0,shelf:1,pos:0},{id:1,shelf:1,pos:1},{id:2,shelf:1,pos:2},{id:3,shelf:1,pos:3},{id:4,shelf:2,pos:0},{id:5,shelf:2,pos:1},{id:6,shelf:2,pos:2},{id:3,shelf:2,pos:3},{id:7,shelf:3,pos:0},{id:8,shelf:3,pos:1},{id:9,shelf:3,pos:2},{id:5,shelf:3,pos:3}];
function save(){localStorage.setItem('terrainium-coins',coins);localStorage.setItem('terrainium-level',level);localStorage.setItem('terrainium-oxygen',oxygen);localStorage.setItem('terrainium-owned-plants',JSON.stringify(owned));localStorage.setItem('terrainium-owned-worlds',JSON.stringify(ownedWorlds));localStorage.setItem('terrainium-room',world);updateUI()}
function updateUI(){$('coins').textContent=coins;$('oxy').textContent=Math.round(oxygen)+'%';$('level').textContent=level;$('statcoins').textContent=coins;$('statplants').textContent=owned.length;$('statworlds').textContent=ownedWorlds.length;$('statlevel').textContent=level;$('xpbar').style.width=((watered%5)/5*100)+'%'}
function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function plantArt(p,cx,base,size,scale=1){const s=size*scale,green=p.color;const asset=assetImages[p.id];if(asset&&asset.complete&&asset.naturalWidth){ctx.drawImage(asset,cx-s*.78,base-s*1.62,s*1.56,s*1.76);return}ctx.save();ctx.translate(cx,base);ctx.scale(s/100,s/100);ctx.lineCap='round';ctx.lineJoin='round';
function leaf(x,y,rx,ry,rot,color=green){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.restore()}
function line(x1,y1,x2,y2,w=4,color='#26713b'){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineWidth=w;ctx.strokeStyle=color;ctx.stroke()}
if(p.type==='fern'){for(let j=0;j<7;j++){let y=-12-j*8,spread=29*(1-j/8);line(0,0,-spread,y,3);line(0,0,spread,y,3);leaf(-spread*.7,y+5,spread*.5,6,-.65,j%2?'#008d22':'#087b21');leaf(spread*.7,y+5,spread*.5,6,.65,j%2?'#008d22':'#087b21')}leaf(0,-70,8,18,0)}
else if(p.type==='round'){for(let j=0;j<5;j++)for(let side of [-1,1]){let y=-18-j*10;line(0,0,side*(10+j*3),y,2);leaf(side*(12+j*3),y,13,6,side*.3,j%2?'#b7f2ca':'#94e9b5')}}
else if(p.type==='bubble'||p.type==='money'||p.type==='bonsai'){line(0,0,0,-75,5);for(let j=0;j<7;j++){let a=j*2.399,r=12+(j%3)*8,x=Math.cos(a)*r,y=-20-Math.floor(j/2)*15;line(0,-20,x,y,3);if(p.type==='bubble'){ctx.beginPath();ctx.arc(x,y,12+(j%2)*2,0,7);ctx.fillStyle=j%3?'#009c13':'#07880e';ctx.fill();ctx.beginPath();ctx.arc(x-3,y-3,3,0,7);ctx.fillStyle='#42be24';ctx.fill()}else leaf(x,y,12,7,a,'#0e992d')}}
else if(p.type==='trailing'){for(let j=0;j<8;j++){let x=-32+j*9;line(0,-55,x,-25,3);for(let k=0;k<6;k++){let yy=-25+k*10;leaf(x+Math.sin(k+j)*5,yy,6,5,.4,k%2?'#00a95a':'#008c4b')}}}
else if(p.type==='snake'){for(let j=0;j<5;j++){let x=(j-2)*11;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(x-9,-45,x,-98+Math.abs(j-2)*9);ctx.quadraticCurveTo(x+10,-50,0,0);ctx.fillStyle=j%2?'#14853b':'#087039';ctx.fill();ctx.strokeStyle='#d0d449';ctx.lineWidth=3;ctx.stroke()}}
else if(p.type==='fan'||p.type==='cactus'){for(let j=0;j<9;j++){let a=-Math.PI*.88+j*Math.PI*.22;ctx.save();ctx.translate(0,-10);ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(22,-45,0,-95+Math.abs(j-4)*7);ctx.quadraticCurveTo(-10,-42,0,0);ctx.fillStyle=j%2?'#07913d':'#168e32';ctx.fill();ctx.strokeStyle='#a7ca31';ctx.lineWidth=2;ctx.stroke();ctx.restore()}}
else{for(let j=0;j<5;j++){let a=j*Math.PI*2/5;leaf(Math.cos(a)*15,-55+Math.sin(a)*8,13,7,a,p.type==='orchid'?'#d89aff':'#19a33c')}ctx.beginPath();ctx.arc(0,-55,8,0,7);ctx.fillStyle='#ffd33f';ctx.fill()}
ctx.restore()}
function pot(cx,y,w,h,color,seed){const x=cx-w/2;ctx.save();ctx.shadowColor='#001c3d55';ctx.shadowBlur=3;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x+4,y);ctx.lineTo(x+w-4,y);ctx.lineTo(x+w*.82,y+h);ctx.lineTo(x+w*.18,y+h);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=lighten(color);ctx.fillRect(x,y-7,w,10);ctx.fillStyle='#ffffff22';ctx.beginPath();ctx.moveTo(x+8,y+5);ctx.lineTo(x+w*.25,y+5);ctx.lineTo(x+w*.3,y+h-5);ctx.lineTo(x+w*.2,y+h-5);ctx.fill();for(let j=0;j<5;j++){for(let k=0;k<2;k++){ctx.beginPath();ctx.arc(x+12+j*(w-24)/4,y+14+k*(h-20)/2,4,0,7);ctx.fillStyle=seed?'#ffffff25':'#00385a20';ctx.fill()}}ctx.restore()}
function lighten(hex){let n=parseInt(hex.slice(1),16),r=Math.min(255,((n>>16)&255)+25),g=Math.min(255,((n>>8)&255)+25),b=Math.min(255,(n&255)+25);return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}
function draw(){let w=innerWidth,h=innerHeight,dpr=Math.min(devicePixelRatio||1,1.5);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px'}ctx.setTransform(dpr,0,0,dpr,0,0);
let top=80+(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-top'))||0),bottom=h-76-(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-bottom'))||0);top=Math.max(top,80);bottom=Math.min(bottom,h-76);
let bg=world==='moon'?'#082a5d':world==='desert'?'#b46e40':world==='tropical'?'#075d4c':world==='flower'?'#42377d':'#073875';ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);const roomImage=worldImages[world];if(roomImage&&roomImage.complete&&roomImage.naturalWidth){ctx.globalAlpha=.30;ctx.drawImage(roomImage,0,top,w,bottom-top);ctx.globalAlpha=1}
for(let i=0;i<23;i++){let x=(i*91+20)%w,y=top+((i*71)%(Math.max(1,bottom-top)));ctx.beginPath();ctx.arc(x,y,15+(i%4)*8,0,7);ctx.fillStyle=world==='moon'?'#16447755':'#12518a55';ctx.fill()}
let roomW=Math.min(w-28,850),left=(w-roomW)/2,shH=(bottom-top)/3.45;
ctx.fillStyle='#405273';ctx.fillRect(left,top,roomW, bottom-top);ctx.fillStyle=bg;ctx.fillRect(left+12,top,roomW-24,bottom-top);
for(let shelf=0;shelf<4;shelf++){let y=top+shelf*shH+shH*.83;if(y>bottom)continue;
ctx.fillStyle='#394a6b';ctx.fillRect(left+7,y-6,roomW-14,17);ctx.fillStyle='#9b633a';ctx.fillRect(left,y,roomW,12);ctx.fillStyle='#bd8753';ctx.fillRect(left,y,roomW*.7,5);ctx.fillStyle='#754627';ctx.fillRect(left+roomW*.84,y,roomW*.16,7);
ctx.fillStyle='#354967';ctx.fillRect(left+8,y+12,12,shH*.18);ctx.fillRect(left+roomW-20,y+12,12,shH*.18);
if(shelf===0){for(let i=0;i<3;i++){let p=plants[(i+4)%plants.length],cx=left+roomW*(.22+i*.28),base=y-8;plantArt(p,cx,base,55,.9);pot(cx,base,65,47,['#db2b2b','#efa900','#49b8cb'][i],i)}}}
for(let shelf=0;shelf<3;shelf++){let shelfY=top+(shelf+1)*shH*.99;let base=shelfY-9;let count=4;for(let j=0;j<count;j++){let x=left+roomW*(.13+j*.245),p=plants[placed[shelf*4+j]?.id??j],sz=Math.min(62,roomW*.085);let tall=p.type==='snake'||p.type==='fan'?1.45:1.05;plantArt(p,x,base-40,sz,tall);pot(x,base-37,sz*1.55,Math.min(120,shH*.48),p.pot,j%2);if(shelf===0&&j===3){ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';ctx.fillText('+826',x-27,base-170)}else if(shelf===1&&j===1){ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';ctx.fillText('+399',x-28,base-80)}else if(shelf===2&&j===1){ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';ctx.fillText('+261',x-27,base-75)}}}
if(world==='desert'){ctx.fillStyle='#e3c27d';ctx.fillRect(left+10,bottom-22,roomW-20,22)}}
function loop(){draw();requestAnimationFrame(loop)}
function showToast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function openSheet(which){tab=which;$('back').classList.add('open');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===which));const cards=$('cards');cards.innerHTML='';
if(which==='store'){ $('title').textContent='Plant store';$('desc').textContent='Collect different plants for your greenhouse. New plants need coins and some require a level.';plants.forEach(p=>{let has=owned.includes(p.id),locked=level<p.level;addCard(p.emoji,p.name,p.desc+(p.level>1?' · Level '+p.level:''),has?'Owned':locked?'🔒 Level '+p.level:'♦ '+p.price+' · Buy',has||locked,()=>{if(coins<p.price){showToast('Not enough coins yet');return}coins-=p.price;owned.push(p.id);save();openSheet('store');showToast(p.name+' unlocked')})})}
else if(which==='worlds'){ $('title').textContent='Worlds & levels';$('desc').textContent='Reach each level requirement, then spend coins to unlock a new plant room.';worlds.forEach(q=>{let has=ownedWorlds.includes(q.id),locked=level<q.level;addCard(q.emoji,q.name,q.desc+' · Requires level '+q.level,world===q.id?'Current world':locked?'🔒 Level '+q.level:has?'Enter world':'♦ '+q.cost+' · Unlock',world===q.id||locked,()=>{if(level<q.level){showToast('Reach level '+q.level+' first');return}if(!ownedWorlds.includes(q.id)){if(coins<q.cost){showToast('You need more leaf coins');return}coins-=q.cost;ownedWorlds.push(q.id)}world=q.id;save();draw();openSheet('worlds');showToast(q.name+' selected')})})}
else if(which==='collection'){ $('title').textContent='My plants';$('desc').textContent='Choose a plant to place on your shelves. Different plants have their own silhouettes.';plants.filter(p=>owned.includes(p.id)).forEach(p=>addCard(p.emoji,p.name,p.desc,selected===p.id?'Selected':'Choose plant',selected===p.id,()=>{selected=p.id;placed.push({id:p.id,shelf:1,pos:placed.length%4});$('back').classList.remove('open');showToast(p.name+' selected — tap a shelf to place it')}))}
else if(which==='decor'){ $('title').textContent='Decor studio';$('desc').textContent='Change the look of your plant room.';[{name:'Classic blue shelves',emoji:'🪵',price:0,act:()=>world='greenhouse'},{name:'Moonlight room',emoji:'🌙',price:50,act:()=>{if(coins>=50){coins-=50;world='moon'}else showToast('Need 50 coins')}},{name:'Tropical room',emoji:'🌴',price:80,act:()=>{if(coins>=80){coins-=80;world='tropical'}else showToast('Need 80 coins')}}].forEach(d=>addCard(d.emoji,d.name,'Change your greenhouse theme','Select',false,()=>{d.act();save();draw();showToast('Room updated')}))}
else{ $('title').textContent='Garden settings';$('desc').textContent='Water plants to earn coins, oxygen and levels. Unlock worlds by reaching the required level.';addCard('💧','Water your plants','Restore oxygen and earn 5 coins plus one level.','Water now',false,water)}
updateUI()}
function addCard(emoji,name,desc,label,disabled,action){let c=document.createElement('article');c.className='card';c.innerHTML='<div class="art">'+emoji+'</div><b></b><small></small><button class="buy"></button>';const plantEntry=plants.find(p=>p.name===name);if(plantEntry&&assetImages[plantEntry.id]){const art=c.querySelector('.art');art.textContent='';const img=document.createElement('img');img.src=new URL('assets/plants/'+assetPlants[plantEntry.id],document.baseURI).href;img.alt=name;img.style.cssText='height:100%;max-width:100%;object-fit:contain';art.appendChild(img)}c.querySelector('b').textContent=name;c.querySelector('small').textContent=desc;c.querySelector('button').textContent=label;c.querySelector('button').disabled=disabled;c.querySelector('button').onclick=action;$('cards').appendChild(c)}
function water(){oxygen=Math.min(100,oxygen+20);coins+=5;level++;watered++;save();showToast('Watered! +5 coins · Level '+level+' · Oxygen restored');if($('back').classList.contains('open'))openSheet(tab)}
function updateUI(){$('coins').textContent=coins;$('oxy').textContent=Math.round(oxygen)+'%';$('level').textContent=level;$('statcoins').textContent=coins;$('statplants').textContent=owned.length;$('statworlds').textContent=ownedWorlds.length;$('statlevel').textContent=level;$('xpbar').style.width=((watered%5)/5*100)+'%'}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>b.dataset.tab==='garden'?($('back').classList.remove('open'),document.querySelectorAll('.nav button').forEach(n=>n.classList.toggle('active',n===b))):openSheet(b.dataset.tab));
$('close').onclick=()=>$('back').classList.remove('open');$('back').onclick=e=>{if(e.target===$('back'))$('back').classList.remove('open')};$('addplant').onclick=()=>openSheet('collection');$('palette').onclick=()=>openSheet('collection');$('settings').onclick=()=>openSheet('settings');$('waterTop').onclick=water;
let touchStart=null;canvas.addEventListener('pointerdown',e=>{touchStart={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',e=>{if(!touchStart)return;let dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;if(Math.abs(dx)<12&&Math.abs(dy)<12){let w=innerWidth,left=(w-Math.min(w-28,850))/2,slot=Math.max(0,Math.min(3,Math.floor((e.clientX-left)/(Math.min(w-28,850)/4)))),shelf=Math.max(0,Math.min(2,Math.floor((e.clientY-80)/((innerHeight-160)/3))));if(owned.includes(selected)){placed.push({id:selected,shelf,pos:slot});showToast(plants[selected].name+' placed on shelf')}}touchStart=null});
window.addEventListener('resize',draw);updateUI();loop();
})();</script></body></html>
